<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Australian Fire Watch notification fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f8fafc;
        background: #0b1117;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        border: 8px solid #232b34;
        border-radius: 48px;
        background:
          radial-gradient(circle at 84% 15%, rgba(251, 146, 60, .42), transparent 25%),
          radial-gradient(circle at 18% 75%, rgba(14, 165, 233, .3), transparent 29%),
          linear-gradient(145deg, #0d1e2c 0%, #17212b 42%, #26160e 100%);
        box-shadow: 0 26px 70px rgba(0, 0, 0, .55);
      }
      .phone::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        width: 120px;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 20px;
        background: #050709;
      }
      .status {
        display: flex;
        justify-content: space-between;
        padding: 16px 25px 0;
        font-size: 13px;
        font-weight: 750;
      }
      .status span:last-child { letter-spacing: 3px; }
      .clock {
        margin-top: 72px;
        text-align: center;
        text-shadow: 0 2px 12px rgba(0, 0, 0, .45);
      }
      .clock strong { display: block; font-size: 76px; font-weight: 300; line-height: .95; }
      .clock span { font-size: 17px; font-weight: 650; }
      .notification {
        margin: 60px 14px 0;
        padding: 15px 15px 13px;
        border: 1px solid rgba(255, 255, 255, .24);
        border-radius: 23px;
        background: rgba(20, 26, 32, .88);
        box-shadow: 0 16px 38px rgba(0, 0, 0, .34);
        backdrop-filter: blur(18px);
      }
      .app-row { display: flex; gap: 10px; align-items: center; }
      .app-row img {
        width: 42px;
        height: 42px;
        object-fit: contain;
        border-radius: 10px;
        background: #07111b;
      }
      .app-name { flex: 1; font-size: 13px; font-weight: 760; letter-spacing: .01em; }
      .app-name span { color: #aab7c4; font-weight: 500; }
      h1 { margin: 13px 0 5px; font-size: 18px; line-height: 1.25; }
      p { margin: 0; color: #e4ebf2; font-size: 14px; line-height: 1.42; }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 8px;
        margin-top: 14px;
      }
      .actions span {
        padding: 9px 7px;
        border-radius: 12px;
        color: #67d4ff;
        background: rgba(255, 255, 255, .08);
        font-size: 12px;
        font-weight: 750;
        text-align: center;
      }
      .actions span:last-child { grid-column: 1 / -1; }
      .demo-label {
        position: absolute;
        right: 0;
        bottom: 33px;
        left: 0;
        color: rgba(255, 255, 255, .72);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .12em;
        text-align: center;
      }
      .home-indicator {
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: 128px;
        height: 5px;
        transform: translateX(-50%);
        border-radius: 6px;
        background: rgba(255, 255, 255, .9);
      }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="Demonstration mobile notification">
      <div class="status"><span>10:22</span><span>● ◒ ▮</span></div>
      <div class="clock"><strong>10:22</strong><span>Saturday, 5 September</span></div>
      <section class="notification">
        <div class="app-row">
          <img src="../custom_components/australian_fire_watch/brand/icon.png" alt="">
          <div class="app-name">Australian Fire Watch <span>· now</span></div>
          <span aria-hidden="true">⌄</span>
        </div>
        <h1>Advice — Ridge Road, Demo Valley</h1>
        <p>New: Advice; Being Controlled; 8.4 km north-east of Demo Home. Stay up to date and check official updates now.</p>
        <div class="actions" aria-label="Notification actions">
          <span>Acknowledge</span>
          <span>Snooze 120 min</span>
          <span>Open official map</span>
        </div>
      </section>
      <div class="demo-label">DEMONSTRATION · NO INCIDENT EXISTS</div>
      <div class="home-indicator"></div>
    </main>
  </body>
</html>
