name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HACS packaging
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate integration metadata and translations
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Unit and packaging tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Compile integration
        run: python -m compileall -q custom_components tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
