name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HACS packaging
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate integration metadata and translations
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Unit and packaging tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml aiohttp
      - name: Compile integration
        run: python -m compileall -q custom_components tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  runtime:
    name: Home Assistant runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: python -m pip install -r requirements-test-ha.txt
      - name: Run actual Home Assistant setup and failure-path tests
        run: python -m pytest -q tests_ha --asyncio-mode=auto

  syntax:
    name: Python and JavaScript static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install ruff
      - run: ruff check --select F821,F822,F823 custom_components tests tests_ha
      - run: node --check custom_components/australian_fire_watch/frontend/australian-fire-watch-panel.js
