name: Review source snapshot
on:
  push:
    branches: [fix/fire-watch-reliability]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: source.zip
          retention-days: 1
