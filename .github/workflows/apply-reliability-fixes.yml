name: Build and verify reliability fixes
on:
  push:
    branches: [fix/reliability-audit]
    paths:
      - _apply_reliability_fixes.py
      - integration_tests/**
      - custom_components/australian_fire_watch/feed_safety.py
      - custom_components/australian_fire_watch/notification_outbox.py
      - custom_components/australian_fire_watch/warning_geometry.py
      - .github/workflows/apply-reliability-fixes.yml
permissions:
  contents: write
concurrency:
  group: reliability-audit-builder
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'HallyAus/australian-fire-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: integration_tests/requirements.txt
      - name: Install validation dependencies
        run: python -m pip install -r integration_tests/requirements.txt ruff
      - name: Apply guarded patch and remove one-use builder
        run: |
          python _apply_reliability_fixes.py
          rm _apply_reliability_fixes.py .github/workflows/apply-reliability-fixes.yml
          ruff check --select F401 --fix custom_components/australian_fire_watch
          ruff format custom_components/australian_fire_watch/*.py integration_tests
      - name: Compile and lint changed source
        run: |
          python -m compileall -q custom_components tests integration_tests
          ruff check --select E9,F63,F7,F82 custom_components/australian_fire_watch integration_tests
      - name: Run complete unit and packaging suite
        run: python -m unittest discover -s tests -v
      - name: Run Home Assistant runtime tests
        run: python -m pytest -c integration_tests/pytest.ini integration_tests -v --junitxml=/tmp/reliability-tests.xml
      - name: Check bundled JavaScript
        run: node --check custom_components/australian_fire_watch/frontend/australian-fire-watch-panel.js
      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@master
      - name: Validate HACS package
        uses: hacs/action@main
        with:
          category: integration
      - name: Preserve validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-test-results
          path: /tmp/reliability-tests.xml
          if-no-files-found: ignore
      - name: Commit tested files to the review branch
        run: |
          git config user.name 'HallyAus'
          git config user.email '37143514+HallyAus@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden fire feed reliability and notification delivery'
          git push origin HEAD:refs/heads/fix/reliability-audit
          git log -1 --format='Verified commit: %H%nVerified tree: %T'
